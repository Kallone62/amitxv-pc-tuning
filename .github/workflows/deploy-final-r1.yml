name: Deploy audited final r1 baseline

on:
  push:
    paths:
      - '.github/workflows/deploy-final-r1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and deploy final r1
        shell: bash
        run: |
          set -euo pipefail

          base64 -d .bootstrap/final-r1-all.b64 > /tmp/repo_overlay.tar.xz
          echo "b15b7a531643662f429e30a60f4af9327fa1850dace7e2032ac8d9c55d1b819f  /tmp/repo_overlay.tar.xz" | sha256sum -c -

          tar -xJf /tmp/repo_overlay.tar.xz -C .

          rm -f .scripts/CS2-GamingOnly-Pro-v1.0.8.ps1

          rm -f .bootstrap/final-r1*
          rm -f .github/workflows/deploy-final-r1.yml
          rmdir .bootstrap 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          find . -type f \
            ! -path './.git/*' \
            ! -path './MANIFEST.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy audited 2026-10-08 final r1 baseline"
          git push
